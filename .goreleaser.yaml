# goreleaser builds recap for macOS and Linux and attaches the archives to the GitHub
# release that release-please creates (.github/workflows/release.yml).
# Dry run: mise run release-check.
version: 2

project_name: recap

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: recap
    main: ./cmd/recap
    binary: recap
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - recap.example.yaml
      - footer.example.md

checksum:
  name_template: checksums.txt

# release-please writes the release notes and CHANGELOG.md.
changelog:
  disable: true

release:
  github:
    owner: aldersfors
    name: recap
  draft: false
  prerelease: auto
  mode: keep-existing
